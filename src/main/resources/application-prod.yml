spring:
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

pawstep:
  rate-limit:
    trust-forwarded-for: true
  auth:
    email-verification-required: true
    log-codes: false
  triage:
    require-reviewed: true

management:
  endpoints:
    web:
      exposure:
        include: health
