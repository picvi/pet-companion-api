spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pet_companion}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 30d

pawstep:
  admin:
    # comma-separated; the daily food digest goes here. Mail itself is set with spring.mail.* (SPRING_MAIL_HOST, ...).
    emails: ${PAWSTEP_ADMIN_EMAILS:}
